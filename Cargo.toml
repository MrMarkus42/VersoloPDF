[package]
name = "versolopdf"
version = "1.1.2"
edition = "2024"
rust-version = "1.88"
description = "VersoloPDF - a free, open-source PDF viewer and editor"
license = "MIT OR Apache-2.0"
authors = ["Mr. M"]
repository = "https://github.com/MrMarkus42/VersoloPDF"
homepage = "https://mrmarkus42.github.io/VersoloPDF/"
readme = "README.md"
keywords = ["pdf", "viewer", "editor", "annotation"]
categories = ["gui", "text-processing"]

[lib]
name = "versolopdf"
path = "src/lib.rs"

[[bin]]
name = "versolopdf"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "persistence", "wayland", "wgpu", "x11"] }
egui = "=0.36.2"
# "pdfium_7881": the API level of the bindings; newer PDFium builds
# (scripts/fetch-pdfium.sh) keep this API.
pdfium-render = { version = "=0.9.4", default-features = false, features = ["image_025", "pdfium_7881", "thread_safe"] }
lopdf = { version = "=0.46.0", default-features = false }
rfd = "=0.17.2"
aes = "0.9"
cbc = "0.2"
getrandom = "0.4"
quick-xml = "0.41"
# Same version eframe already uses for its own persistence.
ron = "=0.12.2"
# Same version and features egui-winit already uses (clipboard).
arboard = { version = "=3.6.1", features = ["image-data"] }
sha2 = "0.11"
# Same version epaint already uses; glyph outlines for "In Kurven umwandeln".
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
stringprep = "0.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp", "pnm", "tga", "ico"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
thiserror = "2"
# Version already in Cargo.lock; search patterns in bookmark titles.
regex = "=1.13.1"
serde = { version = "1", features = ["derive"] }
# Digital signatures (src/sign): keys, certificates, .pfx/.p12 files.
# 0.13: the 0.14 line needs crypto-bigint 0.7.9+, younger than 14 days.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit"] }
p12-keystore = "0.4"
sha1 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Mapi",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest = { version = "=0.36.2", features = ["eframe", "wgpu"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
# Function names stay in the program, so crash reports show where it
# happened (debug information is removed).
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2

# Prepares assets/versolopdf.png and assets/versolopdf.ico from the icon drawing.
[[example]]
name = "make_icon"
path = "scripts/make_icon.rs"
