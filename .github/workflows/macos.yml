# Builds and tests the macOS app on a Mac of GitHub. Started by hand with a
# release tag, it adds the app package (VersoloPDF-<version>-macos.zip +
# .sha256) to that (draft) release; it is then signed on the developer's
# computer (scripts/sign-release.ps1), which also publishes the release. Nothing is
# rebuilt after publishing, so the signed package stays the one released.
name: macOS

on:
  push:
    branches: [master, macos, "macos-*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Add the package to this release (e.g. v1.2.0); empty: build only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write # only used to add the package to a release
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      - name: PDFium
        run: bash scripts/fetch-pdfium.sh mac-arm64 mac-x64

      - name: Tests
        run: cargo test --locked

      - name: Sandbox of the PDF engine
        run: cargo test --locked --test engine -- --nocapture --test-threads=1

      - name: Keychain test
        run: cargo test --locked --test macos -- --ignored --nocapture

      - name: Package
        run: bash scripts/package-macos.sh

      - name: Start test of the app
        run: |
          app="$(ls -d dist/VersoloPDF-*-macos/VersoloPDF.app)"
          file "$app/Contents/MacOS/VersoloPDF" "$app/Contents/Frameworks/libpdfium.dylib"
          # The app must start with a PDF and keep running (window, PDFium loaded).
          printf '%%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 200]>>endobj\ntrailer<</Root 1 0 R>>\n%%%%EOF\n' > "$RUNNER_TEMP/start.pdf"
          "$app/Contents/MacOS/VersoloPDF" "$RUNNER_TEMP/start.pdf" &
          pid=$!
          sleep 15
          kill -0 "$pid"
          kill "$pid"
          grep -h "gestartet\|PDFium\|PDF-Kern" ~/Library/Application\ Support/VersoloPDF/logs/*.log | tail -6
          # The document was read by the sandboxed PDF engine helper.
          grep -q "PDF-Kern geschützt gestartet: macOS sandbox" ~/Library/Application\ Support/VersoloPDF/logs/*.log
          # The macOS menu bar was built.
          grep -h "Menüleiste" ~/Library/Application\ Support/VersoloPDF/logs/*.log | tail -1
          grep -q "Menüleiste: 8 Menüs" ~/Library/Application\ Support/VersoloPDF/logs/*.log

      - uses: actions/upload-artifact@v4
        with:
          name: VersoloPDF-macos
          path: dist/*-macos.zip*

      - name: Add to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" dist/*-macos.zip dist/*-macos.zip.sha256 --clobber
